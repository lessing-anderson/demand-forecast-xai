# Example configuration for data processing
data:
  raw_path: ./data/raw
  processed_path: ./data/processed
  train_split_date: '2016-04-24'
  store_filter: null  # null for all stores, or 'CA_1', 'TX_1', etc.
  optimize_memory: true

# Model configuration
model:
  type: lightgbm
  params:
    num_leaves: 31
    learning_rate: 0.05
    num_rounds: 1000
    early_stopping_rounds: 50
  
  # Feature engineering
  features:
    lags: [7, 28]
    rolling_windows: [7, 28]

# Experiment tracking
experiment:
  name: baseline_lgb
  output_dir: ./models/artifacts
  save_model: true
  save_predictions: true

# XAI configuration
xai:
  shap:
    enabled: true
    background_samples: 100
  lime:
    enabled: true
    num_features: 10
  feature_importance:
    methods: ['gain', 'permutation']
    top_k: 20
